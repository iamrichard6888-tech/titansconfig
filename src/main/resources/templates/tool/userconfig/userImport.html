<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
  <th:block th:include="include :: header('人员导入与录入')" />
  <style>
    /* ================= Apple 风格专属 CSS ================= */
    body.gray-bg { background-color: #f5f5f7 !important; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif !important; -webkit-font-smoothing: antialiased; }
    .select-table { background: #ffffff !important; border-radius: 18px !important; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04) !important; padding: 24px !important; border: none !important; margin-top: 20px; }
    .btn { border-radius: 20px !important; font-weight: 500 !important; padding: 6px 18px !important; border: none !important; transition: all 0.3s ease !important; box-shadow: none !important; font-size: 13px !important; }
    .btn-info { background-color: #f0f0f5 !important; color: #1d1d1f !important; }
    .btn-info:hover { background-color: #e8e8ed !important; }
    .btn-primary { background-color: #0071e3 !important; color: #ffffff !important; }
    .btn-primary:hover { background-color: #0077ed !important; transform: scale(1.02); }
    .btn-success { background-color: #34c759 !important; color: #ffffff !important; }
    .btn-success:hover { background-color: #30d158 !important; transform: scale(1.02); }
    .btn-danger { background-color: #ff3b30 !important; color: #ffffff !important; }
    .btn-danger:hover { background-color: #ff453a !important; }
    .btn-xs { padding: 4px 12px !important; font-size: 12px !important; }
    .table { border: none !important; }
    .table>thead>tr>th { border-bottom: 1px solid #d2d2d7 !important; border-top: none !important; font-weight: 600 !important; color: #86868b !important; font-size: 12px !important; letter-spacing: 0.5px; background-color: transparent !important; }
    .table>tbody>tr>td { border-top: 1px solid #e5e5ea !important; vertical-align: middle !important; color: #1d1d1f !important; font-size: 14px !important; padding: 14px 8px !important; }
    .table-striped>tbody>tr:nth-of-type(odd) { background-color: #fafafc !important; }
    .table>tbody>tr:hover { background-color: #f5f5f7 !important; }
    .badge { padding: 5px 12px !important; border-radius: 12px !important; font-weight: 500 !important; font-size: 12px !important; }
    .apple-badge-warning { background-color: #fff1d0 !important; color: #d97706 !important; }
    .apple-badge-danger { background-color: #ffe1e1 !important; color: #ff3b30 !important; }
    .apple-badge-primary { background-color: #e1f0ff !important; color: #0071e3 !important; }
    .fixed-table-container { border: none !important; }
    .source-tag { font-size: 11px; color: #86868b; background: #f0f0f5; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body class="gray-bg">
<div class="container-div">
  <div class="row">
    <div class="col-sm-12 search-collapse">
      <form id="formId">
        <div class="select-list">
          <ul>
            <li>
              登录账号：<input type="text" name="loginAccount" placeholder="模糊查询"/>
            </li>
            <li>
              用户姓名：<input type="text" name="userName" placeholder="模糊查询"/>
            </li>
            <li>
              状态：
              <select name="status">
                <option value="">所有状态</option>
                <option value="0">待确认</option>
                <option value="1">需核对</option>
                <option value="2">已入库</option>
              </select>
            </li>
            <li>
              <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
              <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
            </li>
          </ul>
        </div>
      </form>
    </div>

    <div class="btn-group-sm" id="toolbar" role="group" style="padding-left: 10px; margin-top: 10px;">
      <a class="btn btn-info" onclick="openImportWordModal()">
        <i class="fa fa-cloud-upload"></i> 上传 Word
      </a>
      <a class="btn btn-primary" onclick="$.operate.add()" style="margin-left: 8px;">
        <i class="fa fa-plus"></i> 手动新增
      </a>
      <a class="btn btn-success" onclick="saveToFormal()" style="margin-left: 8px;">
        <i class="fa fa-check-circle"></i> 确认入正式系统
      </a>
      <a class="btn btn-danger" onclick="$.operate.removeAll()" style="margin-left: 8px;">
        <i class="fa fa-trash"></i> 删除
      </a>
      <a class="btn btn-primary" onclick="batchAudit()" style="margin-left: 8px;">
        <i class="fa fa-legal"></i> 批量审核
      </a>
    </div>

    <div class="col-sm-12 select-table">
      <table id="bootstrap-table"></table>
    </div>
  </div>
</div>

<script id="importWordTpl" type="text/template">
  <form enctype="multipart/form-data" class="mt20 mb10">
    <div class="col-xs-offset-1">
      <input type="file" id="wordFile" name="wordFile" accept=".doc,.docx" multiple/>
      <div class="mt10 pt5" style="color: #86868b; font-size: 12px;">
        请选择全宗单位提交的标准 Word 名单（支持同时选中多个）。
      </div>
    </div>
  </form>
</script>

<th:block th:include="include :: footer" />
<script th:inline="javascript">
  // 若依标准路由前缀，对应 UserConfigController 上的 @RequestMapping
  var prefix = ctx + "tool/userconfig";

  $(function() {
    var options = {
      url: prefix + "/listTemp",              // 1. 获取中间表列表数据的接口
      createUrl: prefix + "/add",            // 补上这行
      updateUrl: prefix + "/edit/{id}",      // 补上这行
      removeUrl: prefix + "/remove",         // 补上这行
      modalName: "暂存用户",
      showSearch: true,     // 开启搜索
      showRefresh: true,    // 开启刷新按钮
      showColumns: false,
      pagination: true,     // 正式版开启分页
      columns: [
        { checkbox: true },
        { field: 'id', title: '主键ID', visible: false },
        { field: 'loginAccount', title: '登录账号', align: 'center', formatter: function(value) { return "<span style='font-family: monospace;'>" + (value||'') + "</span>"; }},
        { field: 'userName', title: '用户姓名', align: 'center', formatter: function(value) { return "<strong>" + (value||'') + "</strong>"; }},
        { field: 'mobilePhone', title: '手机号码', align: 'center', formatter: function(value) { return value ? value : '<span style="color: #ff3b30;">未填写</span>'; }},
        { field: 'deptName', title: '部门/科室', align: 'center'},
        { field: 'userType', title: '用户类型', align: 'center' },
        { field: 'description', title: '用户描述', align: 'center',width: '200px' },
        { field: 'source', title: '数据来源', align: 'center', formatter: function(value) { return '<span class="source-tag">' + (value||'未知') + '</span>'; }},
        {
          field: 'status',
          title: '状态',
          align: 'center',
          formatter: function(value, row) {
            if (value == '0') {
              return '<span class="badge apple-badge-warning">待确认</span>';
            }
            if (value == '1') {
              // 红色异常提醒
              return '<span class="badge apple-badge-danger" title="'+ (row.errorMsg || '数据异常') +'">' +
                      '<i class="fa fa-times-circle"></i> 需核对</span>';
            }
            if (value == '2') {
              // 【核心新增逻辑】：判断虽然是2，但如果 errorMsg 里有东西，说明是“降级入库”
              if (row.errorMsg != null && row.errorMsg != '') {
                // 浅蓝色带图标的警告徽章，鼠标悬停展示完整的警告内容
                return '<span class="badge" style="background-color: #e8f4fd; color: #0071e3; padding: 5px 12px; border-radius: 12px;" title="'+ row.errorMsg +'">' +
                        '<i class="fa fa-exclamation-circle"></i> 入库(缺角色)</span>';
              } else {
                // 完美入库的绿色/深蓝色徽章
                return '<span class="badge apple-badge-primary">' +
                        '<i class="fa fa-check-circle"></i> 已入库</span>';
              }
            }
          }
        },
        {
          title: '操作', align: 'center',
          formatter: function(value, row, index) {
            var actions = [];

            // 场景 A：状态为 0 (待确认) —— 显示【入库】按钮和编辑、删除
            if (row.status == '0') {
              actions.push('<a class="btn btn-primary btn-xs" href="javascript:void(0)" onclick="singleSaveToFormal(\'' + row.id + '\')"><i class="fa fa-send"></i> 入库</a> ');
              actions.push('<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')">编辑</a> ');
              actions.push('<a class="btn btn-danger btn-xs" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')">删除</a>');
            }

            // 场景 B：状态为 1 (需核对) —— 显示审核按钮、编辑、删除
            else if (row.status == '1') {
              actions.push('<a class="btn btn-warning btn-xs" href="javascript:void(0)" onclick="auditEntry(\'' + row.id + '\')">审核</a> ');
              actions.push('<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')">编辑</a> ');
              actions.push('<a class="btn btn-danger btn-xs" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')">删除</a>');
            }

            // 场景 C：状态为 2 (已入库) —— 【强制】：不显示任何操作按钮，确保数据锁定
            else if (row.status == '2') {
              return '<span style="color: #86868b;">- 数据已锁定 -</span>';
            }

            return actions.join('');
          }
        }]
    };
    $.table.init(options);
  });

  /* ================= 业务动作自定义 ================= */

  // 1. 弹出自定义的 Word 批量上传窗口
  function openImportWordModal() {
    layer.open({
      type: 1,
      area: ['400px', '240px'],
      fix: false,
      maxmin: false,
      shade: 0.3,
      title: '上传 Word 名单文件',
      content: $('#importWordTpl').html(),
      btn: ['<i class="fa fa-check"></i> 开始解析', '<i class="fa fa-remove"></i> 取消'],
      shadeClose: true,
      yes: function (index, layero) {
        var files = layero.find('#wordFile')[0].files;
        if (files.length == 0) {
          $.modal.msgWarning("请至少选择一个 Word 文件");
          return false;
        }
        var formData = new FormData();
        // 将多文件塞入 FormData 发给后端
        for(var i=0; i<files.length; i++){
          formData.append("files", files[i]);
        }
        $.modal.loading("正在逐行解析 Word 表格，请稍候...");
        $.ajax({
          url: prefix + "/importWord",
          type: 'POST',
          data: formData,
          processData: false,
          contentType: false,
          success: function(result) {
            $.modal.closeLoading();
            if (result.code == web_status.SUCCESS) {
              $.modal.close(index);
              $.modal.msgSuccess(result.msg);
              $.table.refresh(); // 解析成功后刷新表格
            } else {
              $.modal.alertError(result.msg);
            }
          }
        });
      }
    });
  }

  function saveToFormal() {
    $.modal.confirm("确认将当前列表中【待确认】的数据写入 T_S_USER 正式表吗？<br><br><span style='color:red; font-size:12px;'>注意：系统将自动跳过状态为异常或已入库的数据。</span>", function() {
      $.modal.loading("正在创建账号及分配角色，请稍后...");
      $.post(prefix + "/saveToFormal", function(result) {

        if (result.code == web_status.SUCCESS) {
          $.modal.msgSuccess(result.msg);

  }*/

  // 单条审核
  function auditEntry(id) {
    $.modal.confirm("确认该条目信息无误，通过审核吗？", function() {
      $.operate.post(prefix + "/audit", { "ids": id });
    });
  }

  // 批量审核
  function batchAudit() {
    var rows = $.table.selectColumns("id"); // 获取选中的ID
    if (rows.length == 0) {
      $.modal.msgWarning("请至少选择一条记录进行审核");
      return;
    }
    $.modal.confirm("确认通过选中的 " + rows.length + " 条审核请求吗？", function() {
      $.operate.post(prefix + "/audit", { "ids": rows.join() });
    });
  }

  // 单条数据执行入库
  function singleSaveToFormal(id) {
    $.modal.confirm("确认将该人员信息写入正式库吗？", function() {
      $.modal.loading("正在写入正式库，请稍候...");
      $.post(prefix + "/saveToFormal", { "ids": id }, function(res) {
        $.modal.closeLoading();
        if (res.code == web_status.SUCCESS) {
          $.modal.msgSuccess(res.msg);
          $.table.refresh();
        } else {
          $.modal.alertError(res.msg);
        }
      });
    });
  }

  // 修改原有的批量入库函数，使其支持勾选入库
  function saveToFormal() {
    var rows = $.table.selectColumns("id");
    var msg = rows.length == 0 ? "确认将所有【待确认】的数据批量写入正式系统吗？" : "确认将选中的 " + rows.length + " 条数据写入正式系统吗？";

    $.modal.confirm(msg, function() {
      $.modal.loading("正在执行入库...");
      $.post(prefix + "/saveToFormal", { "ids": rows.join() }, function(res) {
        $.modal.closeLoading();
        if (res.code == web_status.SUCCESS) {
          $.modal.msgSuccess(res.msg);
          $.table.refresh();
        } else {
          $.modal.alertError(res.msg);
        }
      });
    });
  }

</script>
</body>
</html>
