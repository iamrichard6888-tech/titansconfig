<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('全宗分表操作面板')" />
    <style>
        .control-panel { padding: 15px; background: #f8f9fa; border-radius: 5px; margin-bottom: 15px; }
        .progress-info { font-size: 14px; margin-top: 10px; display: flex; justify-content: space-between;}
    </style>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 control-panel">
            <button type="button" class="btn btn-primary" id="btn-start-stop" onclick="toggleSeperate()">
                <i class="fa fa-play"></i> <span id="btn-text">开始分表</span>
            </button>

            <div class="progress progress-striped active" style="margin-top: 15px; height: 20px;">
                <div id="progress-bar" class="progress-bar progress-bar-success" role="progressbar" style="width: 0%;">0%</div>
            </div>

            <div class="progress-info">
                <span id="progress-text">当前进度：等待开始... (0/0)</span>
                <span id="eta-text" class="text-danger">预计剩余时间：--:--:--</span>
            </div>
        </div>

        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>

<th:block th:include="include :: footer" />
<script th:inline="javascript">
    var prefix = ctx + "tool/download";
    var isSeperating = false; // 当前状态
    var timer = null; // 定时器

    $(function() {
        var options = {
            url: prefix + "/seperateList", // 获取全宗进度列表的接口
            modalName: "分表进度",
            columns: [
                {
                    field: 'PID',
                    title: '工作线程', // 显示线程标识
                    formatter: function(value, row, index) {
                        return '<i class="fa fa-cog fa-spin"></i> ' + (value || '主线程');
                    }
                },
                {
                    field: 'QZH',
                    title: '全宗号'
                },
                {
                    field: 'TABLENAME',
                    title: '生成的表名'
                },
                {
                    field: 'VOLUME',
                    title: '数据量(条)'
                },
                {
                    field: 'STATUS',
                    title: '执行状态',
                    formatter: function(value, row, index) {
                        if (value === '创建中') {
                            return '<span class="badge badge-info"><i class="fa fa-refresh fa-spin"></i> 创建中...</span>';
                        } else if (value === 'true' || value === '创建成功' || value === '表已存在') {
                            return '<span class="badge badge-primary">' + value + '</span>';
                        } else if (value && value.indexOf('失败') !== -1) {
                            return '<span class="badge badge-danger" title="'+value+'">失败 (悬停查看)</span>';
                        }
                        return '<span class="badge badge-warning">等待处理</span>';
                    }
                },
                {
                    field: 'BEGINTIME',
                    title: '开始时间'
                },
                {
                    field: 'ENDTIME',
                    title: '结束时间',
                    formatter: function(value, row, index) {
                        return value ? value : "-"; // 如果是创建中，结束时间显示为横杠
                    }
                }]
        };
        $.table.init(options);

        // 初始化时检查一次后台状态
        checkStatus();
    });

    // 切换开始/停止
    function toggleSeperate() {
        if (isSeperating) {
            $.modal.confirm("确定要停止分表吗？正在执行的全宗如果未完成将会被回滚（删除残表）。", function() {
                $.operate.post(prefix + "/stopSeperate", {}, function(result) {
                    if (result.code == web_status.SUCCESS) {
                        $.modal.msgSuccess("已发送停止指令");
                        checkStatus(); // 刷新状态
                    }
                });
            });
        } else {
            $.operate.post(prefix + "/startSeperate", {}, function(result) {
                if (result.code == web_status.SUCCESS) {
                    $.modal.msgSuccess("任务已启动");
                    checkStatus(); // 启动定时器监听
                }
            });
        }
    }

    // 定时轮询获取后台任务进度
    function checkStatus() {
        $.ajax({
            url: prefix + "/seperateStatus",
            type: 'GET',
            success: function(result) {
                var data = result.data;
                isSeperating = data.isRunning;

                // 更新按钮状态
                if (isSeperating) {
                    $("#btn-start-stop").removeClass("btn-primary").addClass("btn-danger");
                    $("#btn-text").text("停止分表");
                    $("#btn-start-stop").find("i").removeClass("fa-play").addClass("fa-stop");

                    // 启动轮询
                    if(timer == null) {
                        timer = setInterval(checkStatus, 3000); // 每3秒刷新一次
                    }
                } else {
                    $("#btn-start-stop").removeClass("btn-danger").addClass("btn-primary");
                    $("#btn-text").text("开始分表");
                    $("#btn-start-stop").find("i").removeClass("fa-stop").addClass("fa-play");

                    // 停止轮询
                    if(timer != null) {
                        clearInterval(timer);
                        timer = null;
                    }
                }

                // 更新进度条
                if(data.total > 0) {
                    var percent = (data.finished / data.total * 100).toFixed(2);
                    $("#progress-bar").css("width", percent + "%").text(percent + "%");
                    $("#progress-text").text("当前进度：" + data.finished + " / " + data.total + " (已完成/总数)");
                    $("#eta-text").text("预计剩余时间：" + data.eta);
                }

                // 如果正在运行，刷新下方的表格看最新数据
                if (isSeperating) {
                    $.table.refresh();
                }
            }
        });
    }
</script>
</body>
</html>
